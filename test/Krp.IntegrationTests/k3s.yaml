apiVersion: v1
kind: Namespace
metadata:
  name: krp-tests-app-one
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: content
  namespace: krp-tests-app-one
data:
  index.html: app-one-index
  probe.txt: app-one-probe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-one
  namespace: krp-tests-app-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-one
  template:
    metadata:
      labels:
        app: app-one
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 1
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: content
---
apiVersion: v1
kind: Service
metadata:
  name: app-one
  namespace: krp-tests-app-one
spec:
  selector:
    app: app-one
  ports:
    - port: 80
      targetPort: 80
---
